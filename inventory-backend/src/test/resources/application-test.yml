spring:
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true

app:
  auth:
    signing-key: test-only-signing-key-not-used-anywhere-else-0123456789
    issuer: inventory-backend-test
    ttl:
      access: 15m
      refresh: 30d
    rate-limit:
      registrations-per-hour: 100000
      login-attempts-per-minute: 100000

management:
  endpoint:
    health:
      show-details: always

logging:
  level:
    org.flywaydb: info
    org.testcontainers: info
    com.github.dockerjava: warn
    tc.postgres: warn
