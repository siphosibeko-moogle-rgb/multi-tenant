server:
  servlet:
    context-path: /api/v1

spring:
  application:
    name: inventory-backend

  profiles:
    default: local

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  health:
    db:
      enabled: true

app:
  forecasting:
    history-window-days: 365

    horizon-days: 30

logging:
  level:
    org.flywaydb: info
